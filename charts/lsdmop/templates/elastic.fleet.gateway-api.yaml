{{- if and .Values.elastic.fleet.enabled .Values.elastic.ingress.gatewayAPI.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ .Release.Name }}-fleet-backend-tls
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: fleet-server-{{ .Release.Name }}-agent-http
  validation:
    caCertificateRefs:
      - name: {{ .Release.Name }}-fleet-ca
        group: ""
        kind: ConfigMap
    hostname: fleet-server-{{ .Release.Name }}-agent-http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fleet-server-{{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: fleet
spec:
  parentRefs:
    - name: {{ .Values.elastic.ingress.gatewayAPI.privateGateway.name }}
      namespace: {{ .Values.elastic.ingress.gatewayAPI.privateGateway.namespace | default .Release.Namespace }}
  hostnames:
    - {{ .Values.elastic.fleet.ingress.url }}
  rules:
    - backendRefs:
        - name: fleet-server-{{ .Release.Name }}-agent-http
          port: 8220
{{- end }}
